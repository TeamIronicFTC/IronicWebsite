<style>
  /* Tier highlights. Every tile is the same medium size now
     (.sponsor-grid.medium, 400px square from style.css section 19) —
     the tier is shown by the border color instead of the size:
       - .sponsor-tier.gold   → solid gold border + soft gold glow
       - .sponsor-tier.silver → solid silver border + soft silver glow
       - Bronze               → no extra class, keeps the normal
                                dashed tile look */
  .sponsor-tier.gold .sponsor-tile,
  .sponsor-tier.gold .sponsor-tile:hover {
    border: 2px solid #D4AF37;
    box-shadow: 0 0 0 1px rgba(212,175,55,0.35), 0 0 24px rgba(212,175,55,0.18);
  }
  .sponsor-tier.silver .sponsor-tile,
  .sponsor-tier.silver .sponsor-tile:hover {
    border: 2px solid #C0C0C0;
    box-shadow: 0 0 0 1px rgba(192,192,192,0.3), 0 0 24px rgba(192,192,192,0.14);
  }

  /* Real sponsor logos. Most logos are drawn for a white page (KW's
     is black text, Computers' is navy), so they'd vanish on the dark
     tile — a tile holding a logo gets a white background instead.
     The tile is an <a> to the sponsor's site, opening in a new tab;
     hovering lifts it slightly and brightens the tier glow. */
  a.sponsor-tile.has-logo {
    background: #FFFFFF;
    padding: var(--space-32);
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  a.sponsor-tile.has-logo:hover { transform: translateY(-4px); }
  .sponsor-tier.gold a.sponsor-tile.has-logo:hover {
    box-shadow: 0 0 0 1px rgba(212,175,55,0.5), 0 0 36px rgba(212,175,55,0.32);
  }
  .sponsor-tier.silver a.sponsor-tile.has-logo:hover {
    box-shadow: 0 0 0 1px rgba(192,192,192,0.45), 0 0 36px rgba(192,192,192,0.26);
  }
</style>
</head>
<!--
  SPONSORS PAGE

  What's on this page, top to bottom:
    1. Top bar (nav), same one every page uses
    2. Page header, "Our Sponsors" title. No corner gears here,
       same plain header as Team/History.
    3. Sponsors content: a short CTA (blurb + "Get in touch" button)
       above three logo tiers: Gold, Silver, Bronze.

  The "Get in touch" button opens the sponsor form as a popup right
  on top of this page, handled entirely by customgform.com's own
  embed script (not script.js, not the ".modal-overlay" blur used by
  the Newsletter popup — that markup and blur are ours, this popup's
  markup and backdrop are theirs). The div carries the
  data-customgform / data-mode / data-label attributes their embed
  code requires, reuses the existing .sponsor-cta-btn look for the
  trigger itself, and the cgf.js script tag that powers it sits at
  the bottom of the page next to script.js. To point this at a
  different form, swap the data-customgform id below for the new
  form's id from customgform.com. To change the color/theme of the
  form popup itself, that's done on customgform.com's own editor
  (Design tab), not in this site's CSS — see the header note in
  style.css section 19 for more.

  CURRENT SPONSORS:
    - Gold:   KW Homes with Nick   → SponsorPhotos/kw-homes-with-nick.png
              links to http://www.homeswithnickfl.com/
              Vengroff Williams Inc. → SponsorPhotos/Vengroff-Williams-Inc.png
              links to https://vengroffwilliams.com/
    - Silver: Computers Repair + Electronics → SponsorPhotos/computers-repair-plus.png
              links to https://computersrepairplus.com/
    - Bronze: Floralawn → SponsorPhotos/Floralawn.png
              links to https://floralawn.com/
              Homeschool STEAM → SponsorPhotos/Homeschool-STEAM.png
              links to https://www.homeschoolsteamfest.com/
              B Man Computer Services LLC → SponsorPhotos/B-Man-Computer-Services-LLC.png
              links to https://bmancomputers.tech/

  ADDING A SPONSOR: drop the logo into the SponsorPhotos folder, then
  copy one of the <a class="sponsor-tile has-logo">
  tiles below into the right tier, change the href, the img src
  (SponsorPhotos/<logo file>), and
  the alt/aria-label text. If it's the first logo in Bronze, delete
  that tier's placeholder tiles and remove "is-empty" from its div.
  Logos look best as square transparent PNGs; they sit on a white
  tile (see the .has-logo rules in the <style> block above).

  EMPTY TIERS ARE HIDDEN: a tier carrying the class "is-empty"
  (style.css section 24) doesn't show at all, so the page only ever
  shows tiers that actually have logos.

  Gold tiles get a gold highlight border and Silver tiles a silver
  one (the "gold"/"silver" class on .sponsor-tier, styled in the
  <style> block at the top of this file); Bronze keeps the plain
  dashed look. The grid centers and wraps on its own on smaller
  screens.

  SEO: the <title>, meta description, canonical and og: tags in
  <head> are this page's own search-result / link-preview info.

  Full notes on this file's CSS are in style.css section 19.
-->
<body data-page="sponsors.html">


<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo"><span>IRON</span>IC</div>
    <div class="topbar-number mono">FTC #14226</div>
  </div>
  <nav class="topbar-links">
    <a class="nav-link type-button" href="index.html">Overview</a>
    <a class="nav-link type-button" href="team.html">Team</a>
    <a class="nav-link type-button" href="events.html">Events</a>
    <a class="nav-link type-button" href="robots.html">Robots</a>
    <a class="nav-link type-button" href="history.html">History</a>
    <a class="nav-link type-button" href="sponsors.html">Sponsors</a>
  </nav>
  <div class="topbar-meta type-caption mono">
    Season 2026–27<br>
    BIOBUZZ
  </div>
</header>

  <main>

<div class="page active" id="page-sponsors">
  <div class="page-header" style="position: relative; text-align: center; overflow: visible;">
    <h1 class="page-title type-headline" style="white-space: nowrap; position: relative; z-index: 3;">Our Sponsors</h1>
  </div>

  <div class="sponsors-content">

    <!-- CTA: blurb + button, opens the sponsor form as a popup on this page -->
    <div class="sponsor-cta">
      <p class="lead type-body">Interested in becoming a sponsor and helping out a local robotics team?</p>
      <div class="type-button sponsor-cta-btn" role="button" tabindex="0"
           data-customgform="cmts2jukv003i01rs7cdb7ct8"
           data-mode="popup"
           data-label="Get in touch">Get in touch</div>
    </div>

    <!-- TIER 1: Gold — medium tiles with gold highlight -->
    <div class="sponsor-tier gold">
      <div class="events-section-title type-caption">Gold Sponsors</div>
      <div class="sponsor-grid medium">
        <a class="sponsor-tile has-logo" href="http://www.homeswithnickfl.com/"
           target="_blank" rel="noopener" aria-label="KW Homes with Nick (opens in a new tab)">
          <img src="SponsorPhotos/kw-homes-with-nick.png" alt="KW Homes with Nick logo" width="1200" height="1200" loading="lazy">
        </a>
        <a class="sponsor-tile has-logo" href="https://vengroffwilliams.com/"
           target="_blank" rel="noopener" aria-label="Vengroff Williams Inc. (opens in a new tab)">
          <img src="SponsorPhotos/Vengroff-Williams-Inc.png" alt="Vengroff Williams Inc. logo" width="417" height="417" loading="lazy">
        </a>
      </div>
    </div>

    <!-- TIER 2: Silver — medium tiles with silver highlight -->
    <div class="sponsor-tier silver">
      <div class="events-section-title type-caption">Silver Sponsors</div>
      <div class="sponsor-grid medium">
        <a class="sponsor-tile has-logo" href="https://computersrepairplus.com/"
           target="_blank" rel="noopener" aria-label="Computers Repair + Electronics (opens in a new tab)">
          <img src="SponsorPhotos/computers-repair-plus.png" alt="Computers Repair + Electronics logo" width="1000" height="1000" loading="lazy">
        </a>
      </div>
    </div>

    <!-- TIER 3: Bronze — medium tiles, plain dashed look -->
    <div class="sponsor-tier">
      <div class="events-section-title type-caption">Bronze Sponsors</div>
      <div class="sponsor-grid medium">
        <a class="sponsor-tile has-logo" href="https://floralawn.com/"
           target="_blank" rel="noopener" aria-label="Floralawn (opens in a new tab)">
          <img src="SponsorPhotos/Floralawn.png" alt="Floralawn logo" width="471" height="471" loading="lazy">
        </a>
        <a class="sponsor-tile has-logo" href="https://www.homeschoolsteamfest.com/"
           target="_blank" rel="noopener" aria-label="Homeschool STEAM (opens in a new tab)">
          <img src="SponsorPhotos/Homeschool-STEAM.png" alt="Homeschool STEAM logo" width="457" height="457" loading="lazy">
        </a>
        <a class="sponsor-tile has-logo" href="https://bmancomputers.tech/"
           target="_blank" rel="noopener" aria-label="B Man Computer Services LLC (opens in a new tab)">
          <img src="SponsorPhotos/B-Man-Computer-Services-LLC.png" alt="B Man Computer Services LLC logo" width="375" height="375" loading="lazy">
        </a>
      </div>
    </div>

  </div>

</div>

</main>

<!-- RGB light strip, cycles through site colors at the very bottom of the page -->
<div class="rgb-strip"></div>

<script async src="https://cdn.customgform.com/cgf.js"></script>
<script src="script.js"></script>
</body>
</html>
